<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz API Scanner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="popup-container">
    <h1 class="popup-title">Quiz API Scanner</h1>
    <div id="quiz-id" style="margin-bottom:8px;color:#2a7">Quiz ID: </div>
    <div class="form-group">
      <input type="text" id="quizIdInput" class="input-quiz" placeholder="Nhập Quiz ID">
      <button id="scanApiBtn" class="btn-scan">Dò API Quiz</button>
    </div>
    <div id="apiResult" class="result-area"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
